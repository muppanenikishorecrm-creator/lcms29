<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Legal Case Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center">
<div class="w-full max-w-md">
  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center mb-4">
        <i class="fa-solid fa-scale-balanced text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">LCMS</h1>
      <p class="text-gray-500 text-sm mt-1">Legal Case Management System</p>
    </div>

    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form action="/auth/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
        <input type="email" name="email" required placeholder="you@example.com"
          class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-gray-900">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="block w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-gray-900">
      </div>
      <button type="submit"
        class="w-full bg-gray-900 text-white py-2.5 rounded-lg font-medium hover:bg-black transition-colors focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2">
        Sign in
      </button>
    </form>

    <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
      <p class="text-xs font-semibold text-gray-500 mb-2">DEMO ACCOUNTS</p>
      <div class="space-y-1.5 text-xs text-gray-600">
        <div class="flex justify-between"><span class="font-medium">Org Admin:</span><span class="text-gray-500">admin@lcms.in / Admin@123</span></div>
        <div class="flex justify-between"><span class="font-medium">Case Manager:</span><span class="text-gray-500">cm1@lcms.in / Admin@123</span></div>
        <div class="flex justify-between"><span class="font-medium">Lawyer:</span><span class="text-gray-500">lawyer1@lcms.in / Admin@123</span></div>
        <div class="flex justify-between"><span class="font-medium">Stakeholder:</span><span class="text-gray-500">officer1@lcms.in / Admin@123</span></div>
      </div>
    </div>
  </div>
  <p class="text-center text-xs text-gray-400 mt-4">© 2026 LCMS · All rights reserved</p>
</div>
</body>
</html>
